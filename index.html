<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#101820">

<title>هیدرولیک یاسین | تعمیر جعبه فرمان و پمپ هیدرولیک</title>

<meta name="description" content="هیدرولیک یاسین در پرند؛ تعمیر تخصصی جعبه فرمان و پمپ هیدرولیک خودروهای ایرانی. تماس برای مشاوره و مراجعه.">

<style>

*{box-sizing:border-box}

body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3f5f7;color:#202a35;line-height:2}

header{background:#101820;color:white;padding:22px 16px;text-align:center;border-bottom:4px solid #e8a323}

header h1{margin:0;color:#ffbd38;font-size:32px}

header p{margin:5px 0 0;font-size:15px}

.container{max-width:900px;margin:auto;padding:20px}

.hero{background:linear-gradient(135deg,#17232e,#304454);color:white;border-radius:18px;padding:30px 20px;text-align:center;margin-top:20px}

.hero h2{font-size:25px;margin:0 0 12px}

.hero p{margin:0 0 20px}

.button{display:inline-block;text-decoration:none;padding:10px 18px;border-radius:9px;margin:5px;font-weight:bold}

.call{background:#ffbd38;color:#15202a}

.insta{background:#fff;color:#202a35}

.section{background:white;border-radius:15px;padding:20px;margin-top:20px;box-shadow:0 3px 14px #0000000b}

.section h2{margin-top:0;color:#b87908;font-size:22px}

.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}

.service{background:#f5f7f9;padding:14px;border-radius:10px;border-right:4px solid #e8a323}

.cars{display:flex;flex-wrap:wrap;gap:9px}

.cars span{background:#edf1f4;border-radius:8px;padding:7px 13px}

.contact a{color:#125b9a;text-decoration:none}

.address{background:#fff8e9;padding:14px;border-radius:10px}

footer{margin-top:25px;background:#101820;color:#ddd;text-align:center;padding:18px;font-size:13px}
